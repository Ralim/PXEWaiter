[package]
name = "pxe_waiter"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-tftp = "0.4.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = [
  "default",
  "macros",
  "rt-multi-thread",
  "signal",
] }
warp = { version = "0.4", features = ["server"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["rustls"], default-features = false }
tftp_client = "0.3.0"

[profile.release]
strip = true      # Automatically strip symbols from the binary.
lto = true        # Run an LTO optimisation pass over the final binary to shake out any dead leftovers
codegen-units = 1 # Split all the units so LTO can go to town
